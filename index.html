<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Surface Area Optimizer</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      width: 400px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
    }

    h2 {
      color: #1976d2;
      margin-bottom: 15px;
    }

    select, input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #bbb;
      font-size: 1em;
    }

    button {
      background-color: #1976d2;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #125aa0;
    }

    .result {
      margin-top: 25px;
      background: #f7faff;
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
      animation: fadeIn 0.5s ease;
    }

    .result h3 {
      color: #1976d2;
      border-bottom: 1px solid #d0e2ff;
      padding-bottom: 6px;
    }

    .data-line {
      margin: 6px 0;
      font-size: 15px;
    }

    .highlight {
      font-weight: 600;
      color: #0078d4;
    }

    footer {
      margin-top: 25px;
      text-align: center;
      color: #555;
      font-size: 14px;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔹 Minimum Surface Area Calculator</h2>
    <label for="shape">Select Shape:</label>
    <select id="shape">
      <option value="">--Select--</option>
      <option value="cube">Cube</option>
      <option value="cuboid">Cuboid</option>
      <option value="cylinder">Cylinder</option>
      <option value="sphere">Sphere</option>
      <option value="cone">Cone</option>
      <option value="hemisphere">Hemisphere</option>
      <option value="squarePyramid">Square Pyramid</option>
      <option value="rectPrism">Rectangular Prism</option>
      <option value="triangularPrism">Triangular Prism</option>
      <option value="torus">Torus</option>
    </select>

    <label for="volume">Enter Volume (in cm³):</label>
    <input type="number" id="volume" placeholder="e.g. 100" />

    <button onclick="calculate()">Calculate</button>

    <div id="output" class="result"></div>
  </div>

  <footer>2025 @ Krima engineering mathematics project.</footer>

  <script>
    function calculate() {
      const shape = document.getElementById('shape').value;
      const volume = parseFloat(document.getElementById('volume').value);
      const output = document.getElementById('output');
      output.innerHTML = "";

      if (!shape || !volume || volume <= 0) {
        output.innerHTML = "<p style='color:red;'>⚠ Please select a shape and enter a valid volume.</p>";
        return;
      }

      let html = "";

      if (shape === "cube") {
        const a = Math.cbrt(volume);
        const sa = 6 * a * a;
        html = `<h3>Shape: Cube</h3>
                <div class="data-line">Side = <span class="highlight">${a.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> For the same volume, a <b>sphere</b> would use even less material.</p>`;
      } 
      else if (shape === "cuboid") {
        const a = Math.cbrt(volume);
        const sa = 6 * a * a;
        html = `<h3>Shape: Cuboid</h3>
                <div class="data-line">Optimal Dimensions (L=W=H) = <span class="highlight">${a.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p>When all sides are equal, a cuboid becomes a cube for minimal SA.</p>`;
      } 
      else if (shape === "cylinder") {
        const r = Math.cbrt(volume / (2 * Math.PI));
        const h = 2 * r;
        const sa = 2 * Math.PI * r * (r + h);
        html = `<h3>Shape: Cylinder</h3>
                <div class="data-line">Radius = <span class="highlight">${r.toFixed(2)} cm</span></div>
                <div class="data-line">Height = <span class="highlight">${h.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> A sphere of same volume would have lesser surface area than a cylinder.</p>`;
      } 
      else if (shape === "sphere") {
        const r = Math.cbrt((3 * volume) / (4 * Math.PI));
        const sa = 4 * Math.PI * r * r;
        html = `<h3>Shape: Sphere</h3>
                <div class="data-line">Radius = <span class="highlight">${r.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p>A sphere has the least surface area for a given volume — it’s the most efficient shape!</p>`;
      } 
      else if (shape === "cone") {
        const r = Math.cbrt((3 * volume) / (Math.PI * Math.sqrt(4)));
        const h = Math.sqrt(3) * r;
        const l = Math.sqrt(r * r + h * h);
        const sa = Math.PI * r * (r + l);
        html = `<h3>Shape: Cone</h3>
                <div class="data-line">Radius = <span class="highlight">${r.toFixed(2)} cm</span></div>
                <div class="data-line">Height = <span class="highlight">${h.toFixed(2)} cm</span></div>
                <div class="data-line">Slant Height = <span class="highlight">${l.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> A sphere has less SA than a cone for the same volume.</p>`;
      } 
      else if (shape === "hemisphere") {
        const r = Math.cbrt((3 * volume) / (2 * Math.PI));
        const sa = 3 * Math.PI * r * r;
        html = `<h3>Shape: Hemisphere</h3>
                <div class="data-line">Radius = <span class="highlight">${r.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> Half of a sphere — slightly less efficient than a full sphere.</p>`;
      }
      else if (shape === "squarePyramid") {
        const a = Math.cbrt(volume); 
        const h = a; 
        const sa = a * a + 2 * a * Math.sqrt((a / 2) ** 2 + h ** 2);
        html = `<h3>Shape: Square Pyramid</h3>
                <div class="data-line">Base Side = <span class="highlight">${a.toFixed(2)} cm</span></div>
                <div class="data-line">Height = <span class="highlight">${h.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p>⛩ Spheres and cylinders can achieve smaller SA for same volume.</p>`;
      }
      else if (shape === "rectPrism") {
        const a = Math.cbrt(volume);
        const sa = 6 * a * a;
        html = `<h3>Shape: Rectangular Prism</h3>
                <div class="data-line">Optimal Dimensions: L=W=H=${a.toFixed(2)} cm</div>
                <div class="data-line">Minimum Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> Best efficiency when all sides equal — i.e. a cube.</p>`;
      }
      else if (shape === "triangularPrism") {
        const side = Math.cbrt(volume);
        const sa = 5 * side * side;
        html = `<h3>Shape: Triangular Prism</h3>
                <div class="data-line">Side ≈ <span class="highlight">${side.toFixed(2)} cm</span></div>
                <div class="data-line">Minimum Surface Area ≈ <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> Sphere or cylinder would be more optimal for same volume.</p>`;
      }
      else if (shape === "torus") {
        const r = Math.cbrt(volume / (2 * Math.PI * Math.PI));
        const R = 2 * r;
        const sa = 4 * Math.PI * Math.PI * R * r;
        html = `<h3>Shape: Torus</h3>
                <div class="data-line">Minor Radius (r) = <span class="highlight">${r.toFixed(2)} cm</span></div>
                <div class="data-line">Major Radius (R) = <span class="highlight">${R.toFixed(2)} cm</span></div>
                <div class="data-line">Surface Area = <span class="highlight">${sa.toFixed(2)} cm²</span></div>
                <p> Tori look cool, but spheres win the efficiency battle!</p>`;
      }

      output.innerHTML = html;
    }
  </script>
</body>
</html>
