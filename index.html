<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxima & Minima in Real Life — Krima’s Project</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #1c1c1c;
      color: #f0f0f0;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #242424, #0e0e0e);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid #333;
    }

    .sidebar h2 {
      margin-bottom: 25px;
      font-size: 1.1rem;
      color: #fff;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1rem;
      padding: 12px 20px;
      text-align: left;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .tab-btn:hover, .tab-btn.active {
      background: #333;
      color: #fff;
    }

    /* Main content */
    .content {
      flex-grow: 1;
      padding: 40px;
      background: #1c1c1c;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      max-width: 500px;
    }

    .card h3 {
      margin-top: 0;
      color: #fff;
    }

    input, select, button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      margin: 8px 0;
    }

    button {
      cursor: pointer;
      background: #3b82f6;
      border: none;
      transition: 0.3s;
    }

    button:hover {
      background: #2563eb;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    #map {
      height: 400px;
      width: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Maxima & Minima</h2>
    <button class="tab-btn active" data-tab="shapes">Shapes</button>
    <button class="tab-btn" data-tab="crops">Crops</button>
    <button class="tab-btn" data-tab="economics">Economics</button>
    <button class="tab-btn" data-tab="maps">Maps</button>
  </div>

  <div class="content">
    <!-- Shapes Tab -->
    <div id="shapes" class="tab-content active">
      <div class="card">
        <h3>Shape Calculator</h3>
        <select id="shapeType">
          <option value="cube">Cube</option>
          <option value="sphere">Sphere</option>
          <option value="cylinder">Cylinder</option>
        </select>
        <input type="number" id="value1" placeholder="Enter value (side/radius)" />
        <input type="number" id="value2" placeholder="Height (for cylinder only)" />
        <button id="calcShape">Calculate</button>
        <p id="shapeResult"></p>
      </div>
    </div>

    <!-- Crops Tab -->
    <div id="crops" class="tab-content">
      <div class="card">
        <h3>Crop Yield Optimization</h3>
        <input type="number" id="fertilizer" placeholder="Fertilizer (kg)" />
        <button id="calcCrops">Calculate Yield</button>
        <p id="cropResult"></p>
      </div>
    </div>

    <!-- Economics Tab -->
    <div id="economics" class="tab-content">
      <div class="card">
        <h3>Profit Maximization</h3>
        <input type="number" id="price" placeholder="Price per unit" />
        <input type="number" id="cost" placeholder="Cost per unit" />
        <input type="number" id="quantity" placeholder="Quantity sold" />
        <button id="calcEco">Calculate Profit</button>
        <p id="ecoResult"></p>
      </div>
    </div>

    <!-- Maps Tab -->
    <div id="maps" class="tab-content">
      <div class="card">
        <h3>Shortest Distance Map</h3>
        <select id="start">
          <option value="">Select start</option>
          <option value="Ahmedabad">Ahmedabad</option>
          <option value="Baroda">Baroda</option>
          <option value="Surat">Surat</option>
          <option value="Rajkot">Rajkot</option>
        </select>
        <select id="end">
          <option value="">Select destination</option>
          <option value="Ahmedabad">Ahmedabad</option>
          <option value="Baroda">Baroda</option>
          <option value="Surat">Surat</option>
          <option value="Rajkot">Rajkot</option>
        </select>
        <button id="showRoute">Show Route</button>
        <div id="map"></div>
      </div>
    </div>

    <footer>2025 © Krima Engineering Mathematics Project</footer>
  </div>

  <script>
    window.onload = function() {
      // TAB SWITCHING
      const tabs = document.querySelectorAll(".tab-btn");
      const contents = document.querySelectorAll(".tab-content");

      tabs.forEach(btn => {
        btn.addEventListener("click", () => {
          tabs.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          const target = btn.getAttribute("data-tab");
          contents.forEach(c => c.classList.remove("active"));
          document.getElementById(target).classList.add("active");
        });
      });

      // SHAPE CALCULATION
      document.getElementById("calcShape").addEventListener("click", () => {
        const shape = document.getElementById("shapeType").value;
        const v1 = parseFloat(document.getElementById("value1").value);
        const v2 = parseFloat(document.getElementById("value2").value);
        let result = "";
        if (shape === "cube") {
          result = Volume: ${(v1 ** 3).toFixed(2)} | Surface Area: ${(6 * v1 ** 2).toFixed(2)};
        } else if (shape === "sphere") {
          result = Volume: ${((4/3) * Math.PI * v1 ** 3).toFixed(2)} | Surface Area: ${(4 * Math.PI * v1 ** 2).toFixed(2)};
        } else if (shape === "cylinder") {
          result = Volume: ${(Math.PI * v1 ** 2 * v2).toFixed(2)} | Surface Area: ${(2 * Math.PI * v1 * (v1 + v2)).toFixed(2)};
        }
        document.getElementById("shapeResult").textContent = result;
      });

      // CROPS
      document.getElementById("calcCrops").addEventListener("click", () => {
        const f = parseFloat(document.getElementById("fertilizer").value);
        const yieldVal = -(f - 50) ** 2 / 25 + 100; // parabolic max around f=50
        document.getElementById("cropResult").textContent = Optimal yield: ${yieldVal.toFixed(2)} units;
      });

      // ECONOMICS
      document.getElementById("calcEco").addEventListener("click", () => {
        const p = parseFloat(document.getElementById("price").value);
        const c = parseFloat(document.getElementById("cost").value);
        const q = parseFloat(document.getElementById("quantity").value);
        const profit = (p - c) * q;
        document.getElementById("ecoResult").textContent = Profit: ₹${profit.toFixed(2)};
      });

      // MAPS
      let map, directionsService, directionsRenderer;

      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 22.3072, lng: 73.1812 },
          zoom: 7,
        });
        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer();
        directionsRenderer.setMap(map);
      }
      window.initMap = initMap;

      document.getElementById("showRoute").addEventListener("click", () => {
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;
        if (!start || !end) {
          alert("Please select both locations.");
          return;
        }
        directionsService.route(
          {
            origin: start,
            destination: end,
            travelMode: google.maps.TravelMode.DRIVING,
          },
          (response, status) => {
            if (status === "OK") {
              directionsRenderer.setDirections(response);
            } else {
              alert("Route not found: " + status);
            }
          }
        );
      });
    };
  </script>

  <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZXTwjD6KgRTDOu924Z_mmw43v3ANAUR0&callback=initMap" async defer></script>
</body>
</html>
