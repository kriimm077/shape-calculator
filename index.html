<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimum Surface Area Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 360px;
      text-align: center;
    }
    select, input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      background-color: #0078d4;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #005ea3;
    }
    .result {
      margin-top: 15px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Minimum Surface Area Calculator</h2>
    <label for="shape">Select Shape:</label>
    <select id="shape">
      <option value="">--Select--</option>
      <option value="cube">Cube</option>
      <option value="cuboid">Cuboid</option>
      <option value="cylinder">Cylinder</option>
    </select>

    <label for="volume">Enter Volume (in cm³):</label>
    <input type="number" id="volume" placeholder="e.g. 100" />

    <button onclick="calculate()">Calculate</button>

    <div id="output" class="result"></div>
  </div>

  <script>
    function calculate() {
      const shape = document.getElementById('shape').value;
      const volume = parseFloat(document.getElementById('volume').value);
      const output = document.getElementById('output');
      output.innerHTML = "";

      if (!shape || !volume || volume <= 0) {
        output.innerHTML = "<p style='color:red;'>Please select a shape and enter a valid volume.</p>";
        return;
      }

      let result = "";

      if (shape === "cube") {
        const a = Math.cbrt(volume); // side
        const surfaceArea = 6 * a * a;
        result = `<b>Shape:</b> Cube<br>
                  Side = ${a.toFixed(3)} cm<br>
                  Minimum Surface Area = ${surfaceArea.toFixed(3)} cm²`;
      } 
      else if (shape === "cuboid") {
        // For given volume, cube gives minimum SA (L=W=H). We'll treat it like a cube for min SA.
        const a = Math.cbrt(volume);
        const surfaceArea = 6 * a * a;
        result = `<b>Shape:</b> Cuboid (minimum when it's a cube)<br>
                  Dimensions L=W=H=${a.toFixed(3)} cm<br>
                  Minimum Surface Area = ${surfaceArea.toFixed(3)} cm²`;
      } 
      else if (shape === "cylinder") {
        // For a closed cylinder with given volume, SA min occurs at h=2r
        // Volume = πr²h = πr²(2r) = 2πr³ => r = (V/(2π))^(1/3)
        const r = Math.cbrt(volume / (2 * Math.PI));
        const h = 2 * r;
        const surfaceArea = 2 * Math.PI * r * (r + h);
        result = `<b>Shape:</b> Cylinder<br>
                  Radius = ${r.toFixed(3)} cm<br>
                  Height = ${h.toFixed(3)} cm<br>
                  Minimum Surface Area = ${surfaceArea.toFixed(3)} cm²`;
      }

      output.innerHTML = `<hr>${result}`;
    }
  </script>
</body>
</html>
